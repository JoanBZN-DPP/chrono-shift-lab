function load(i,restore){if(MP.over){showFinal();return}if(i!=MP.curLv){MP.curLv=i;MP.lvT=serverNow()}li=i;lv=LV[i];g=lv.map.map(r=>r.split(''));H=g.length;W=g[0].length;M=lv.m;MC=lv.c;blocks0=[];plates={};PO={};

 cur=[];t=0;P={...start};clones=recs.map(()=>({...start}));blocks=blocks0.map(b=>({...b}));open={};calc();state=MP.over?'over':'play';$('msg').textContent='';hud();scheduleSave()}

function calc(){for(const l of 'abcdfgh')open[l.toUpperCase()]=pressed(l);dead=false;beams=[];

 for(const l of lv.L){if(l.p&&pressed(l.p))continue;let x=l.x,y=l.y,ex=x,ey=y;const[dx,dy]=V[l.d];
  for(;;){const nx=x+dx,ny=y+dy;if(solid(nx,ny))break;x=nx;y=ny;ex=x;ey=y;

  beams.push({x:l.x,y:l.y,ex,ey})}}

async function join(){const nm=($('nick')?.value||'').trim().slice(0,16),code=($('joinCode')?.value||'').trim().toUpperCase().replace(/\s+/g,'');if(!nm){MP.err='Escribe tu apodo para unirte a la partida.';lobby();return}if(window.CHRONO_FIREBASE_CONFIG!=null&&(!db||!usr||!networkState.ready)){MP.err='Firebase todavía está sincronizando jugadores. Reintenta la conexión antes de unirte.';lobby();return}if(window.CHRONO_FIREBASE_CONFIG!=null&&!db){MP.err='Firebase no está conectado. Puedes practicar, pero no abrir una sala P2P en este modo.';lobby();return}if(!db){if(!/^[A-Z0-9]{6}$/.test(code)){MP.err='Escribe el código de sala de 6 caracteres.';lobby();return}MP.host=false;await p2pGuestJoin(code,nm);return}if(!MT||!['lobby','count','run'].includes(phase())){MP.err='No hay una partida abierta para unirse. Espera a que el anfitrión la cree.';lobby();return}if(MT.code&&code!==String(MT.code).trim().toUpperCase()){MP.err='El código no coincide con la partida disponible.';lobby();return}if((MT.ban||[]).includes(MP.id)){MP.err='Fuiste expulsado de esta partida.';lobby();return}MP.name=nm;
 let me=PL.find(x=>x.id==MP.id&&x.matchId==MT.id);if(db){const snap=await db.ref('players/'+MP.id).once('value');const remote=snap.val();if(remote&&remote.matchId===MT.id)me={id:MP.id,...remote};}

 const elapsed=Math.max(0,(serverNow()-MP.lvT)/1000),c=gameCfg(),prior=PL.filter(p=>p.matchId==MT?.id&&p.id!=MP.id&&Number(p.solved||0)>li).length,min=Math.min(c.basePoints,c.minPoints),pts=Math.max(min,Math.floor(c.basePoints-(elapsed/60)*c.timePenaltyPerMinute-prior*c.crowdPenalty));let m='';

 if(isAdmin()){adm();return}
 MP.adm=false;
 ov(`<h2>🔐 Acceso de administrador</h2><p>Introduce la contraseña compartida del administrador.</p>${MP.err?'<p role="alert" style="color:#ff5470">'+esc(MP.err)+'</p>':''}<form onsubmit="event.preventDefault();adminLogin()"><label>Contraseña<input id="adminPass" type="password" autocomplete="current-password" required ${adminLoginBusy?'disabled':''}></label><button class="b admin-access" type="submit" ${adminLoginBusy?'disabled':''}>${adminLoginBusy?'Verificando…':'Entrar'}</button><button class="b" type="button" onclick="cancelAdminLogin()">Cancelar</button></form><p class="admin-note">La contraseña se valida en Firebase. No se guarda en este dispositivo ni en el código.</p>`);

async function adminLogin(){
 if(adminLoginBusy)return;
 const pass=$('adminPass')?.value||'';
 if(!pass){MP.err='Escribe la contraseña.';adminGate();return}
 if(window.CHRONO_FIREBASE_CONFIG==null){if(pass.length<8){MP.err='Usa al menos 8 caracteres.';adminGate();return}MP.host=true;MP.adminUnlocked=true;MP.err='';adm();return}
 const attempt=++adminAttempt,session={app:null,auth:null,db:null,listeners:[],ready:false,connected:false,closed:false};
 const current=()=>attempt===adminAttempt&&!session.closed;
 candidateAdminSession=session;adminLoginBusy=true;MP.err='';adminGate();
 const failLive=error=>{
  if(!current()||!session.ready)return;
  const visible=MP.adm;lockAdminSession(session);++adminAttempt;MP.err='La sesión de administrador se desconectó. Vuelve a entrar con la contraseña.';if(visible)adminGate();
 };
 const work=(async()=>{
  const cfg=window.CHRONO_FIREBASE_CONFIG;
  if(!cfg?.apiKey||!cfg.databaseURL||!window.firebase)throw new Error('Firebase no está disponible. Recarga la página o reintenta.');
  session.app=firebase.initializeApp(cfg,'chrono-shift-admin-'+attempt);
  session.auth=firebase.auth(session.app);session.db=firebase.database(session.app);
  await session.auth.setPersistence(firebase.auth.Auth.Persistence.NONE);if(!current())return;

  const role=await session.db.ref('admins/'+user.uid).once('value');if(!current())return;
  if(role.val()!==true)throw new Error('La identidad autenticada no tiene permiso de administrador.');

  const onError=error=>{if(session.ready)failLive(error);else pendingError=error};
  const connectedRef=session.db.ref('.info/connected'),connected=snapshot=>{if(current()){session.connected=!!snapshot.val();renderNetworkStatus()}};
  session.listeners.push([connectedRef,'value',connected]);connectedRef.on('value',connected,onError);
  await Promise.all([
   listenForFirstValue(session.db.ref('match/state'),applyMatchSnapshot,session.listeners,current,onError),
   listenForFirstValue(session.db.ref('players'),applyPlayersSnapshot,session.listeners,current,onError)
  ]);
  if(!current())return;if(pendingError)throw pendingError;
  session.ready=true;activeAdminSession=session;candidateAdminSession=null;
  adminApp=session.app;adminAuth=session.auth;adminDb=session.db;
  MP.firebaseAdmin=true;MP.host=true;MP.adminUnlocked=true;MP.err='';adminLoginBusy=false;renderNetworkStatus();adm();
 })();
 try{await withTimeout(work,'El acceso de administrador')}
 catch(error){
  if(!current())return;
  ++adminAttempt;disposeAdminSession(session);candidateAdminSession=null;adminLoginBusy=false;
  MP.host=false;MP.firebaseAdmin=false;MP.adminUnlocked=false;
  MP.err=['auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials','auth/user-not-found'].includes(error.code)?'Contraseña incorrecta.':error.message||error.code||'No se pudo autenticar al administrador.';
  renderNetworkStatus();adminGate();
 }
}
